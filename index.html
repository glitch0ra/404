<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Персональная галерея медиа-проектов и творческих работ в стилях Liquid Glass и Anti-Design">
    <meta name="keywords" content="медиа-галерея, цифровое искусство, anti-design, liquid glass">
    <title>Личная медиа-галерея</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Анимированная шапка -->
    <header class="site-header" role="banner">
        <div class="header-content">
            <h1 class="site-title">Медиа-галерея</h1>
            <p class="site-subtitle">Персональная коллекция творческих проектов</p>
        </div>
    </header>

    <!-- Основной контейнер сайта -->
    <div class="site-container">
        <!-- Панель навигации по вкладкам -->
        <nav class="tab-panel" role="navigation" aria-label="Основная навигация">
            <ul class="tab-list" role="tablist">
                <li role="presentation">
                    <button class="tab-button active" role="tab" aria-selected="true" aria-controls="tab-main" data-tab="tab-main">Главная</button>
                </li>
                <li role="presentation">
                    <button class="tab-button" role="tab" aria-selected="false" aria-controls="tab-collections" data-tab="tab-collections">Коллекции</button>
                </li>
                <li role="presentation">
                    <button class="tab-button" role="tab" aria-selected="false" aria-controls="tab-screenshots" data-tab="tab-screenshots">Скриншоты</button>
                </li>
                <li role="presentation">
                    <button class="tab-button" role="tab" aria-selected="false" aria-controls="tab-videos" data-tab="tab-videos">Видео</button>
                </li>
                <li role="presentation">
                    <button class="tab-button" role="tab" aria-selected="false" aria-controls="tab-history" data-tab="tab-history">История</button>
                </li>
                <li role="presentation">
                    <button class="tab-button" role="tab" aria-selected="false" aria-controls="tab-about" data-tab="tab-about">Об авторе</button>
                </li>
            </ul>
        </nav>

        <!-- Основной контент -->
        <main class="main-content" role="main">
            <!-- Вкладка: Главная -->
            <section class="tab-content active" id="tab-main" role="tabpanel" aria-labelledby="btn-main">
                <h2 class="visually-hidden">Лента последних проектов</h2>
                <div class="content-area"></div>
            </section>

            <!-- Вкладка: Коллекции -->
            <section class="tab-content" id="tab-collections" role="tabpanel" aria-labelledby="btn-collections">
                <h2 class="visually-hidden">Коллекции работ</h2>
                <div class="content-area"></div>
            </section>

            <!-- Вкладка: Скриншоты -->
            <section class="tab-content" id="tab-screenshots" role="tabpanel" aria-labelledby="btn-screenshots">
                <h2 class="visually-hidden">Галерея скриншотов</h2>
                <div class="content-area"></div>
            </section>

            <!-- Вкладка: Видео -->
            <section class="tab-content" id="tab-videos" role="tabpanel" aria-labelledby="btn-videos">
                <h2 class="visually-hidden">Галерея видео</h2>
                <div class="content-area"></div>
            </section>

            <!-- Вкладка: История -->
            <section class="tab-content" id="tab-history" role="tabpanel" aria-labelledby="btn-history">
                <h2 class="visually-hidden">История создания проектов</h2>
                <div class="content-area"></div>
            </section>

            <!-- Вкладка: Об авторе -->
            <section class="tab-content" id="tab-about" role="tabpanel" aria-labelledby="btn-about">
                <div class="content-area"></div>
            </section>
        </main>
    </div>

    <!-- Универсальное модальное окно -->
    <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content">
            <button class="modal-close" aria-label="Закрыть модальное окно">×</button>
            <div class="modal-header">
                <h2 id="modal-title" class="modal-title"></h2>
            </div>
            <div class="modal-body"></div>
        </div>
    </div>

    <!-- Вспомогательный элемент для семантики -->
    <div class="visually-hidden" aria-live="polite" id="announcement"></div>

    <script src="main.js"></script>
</body>
</html>
