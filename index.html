<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Glitch Slime // [Glitchora]</title>
  <meta name="description" content="Личная медиа-галерея автора Glitchora — цифровые работы, коллекции, видео, скриншоты, истории и эксперименты.">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ======= АНИМИРОВАННАЯ ШАПКА ======= -->
  <header class="page-header" role="banner" aria-label="Анимированная шапка">
    <video autoplay muted loop playsinline class="page-header-video" aria-hidden="true">
      <source src="assets/fonshapka.webm" type="video/webm">
    </video>
  </header>

  <!-- ======= ШЕЙДЕРНЫЕ СЛОИ ======= -->
  <canvas id="shader-canvas" class="shader-layer"></canvas>
  <canvas id="shader-canvas2" class="shader-layer2"></canvas>
  <canvas id="shader-canvas3" class="shader-layer3"></canvas>
  <canvas id="shader-canvas4" class="shader-layer4"></canvas>
  <canvas id="shader-canvas5" class="shader-layer5"></canvas>

  <!-- ======= ФОНОВОЕ ВИДЕО ======= -->
  <video autoplay muted loop playsinline class="bg-full" aria-hidden="true">
    <source src="assets/background.webm" type="video/webm">
  </video>

  <!-- ======= ОСНОВНОЙ ЦЕНТРАЛЬНЫЙ БЛОК ======= -->
  <main class="app-container" role="main">

    <!-- ======= НАВИГАЦИЯ (ВКЛАДКИ) ======= -->
    <nav class="tabs-panel" role="tablist" aria-label="Основная панель навигации">
      <button class="tab-btn active" data-tab="home" role="tab" aria-selected="true">Главная</button>
      <button class="tab-btn" data-tab="collections" role="tab">Коллекции</button>
      <button class="tab-btn" data-tab="screenshots" role="tab">Скриншоты</button>
      <button class="tab-btn" data-tab="videos" role="tab">Видео</button>
      <button class="tab-btn" data-tab="history" role="tab">История</button>
      <button class="tab-btn" data-tab="about" role="tab">Об авторе</button>
    </nav>

    <!-- ======= ОБЛАСТЬ ВКЛАДОК ======= -->
    <section class="pages">

      <!-- Главная -->
      <div id="home" class="page active" data-rendered="false">
        <!-- Заполняется динамически через JS -->
      </div>

      <!-- Коллекции -->
      <div id="collections" class="page" data-rendered="false">
        <!-- Здесь будут блоки с коллекциями -->
      </div>

      <!-- Скриншоты -->
      <div id="screenshots" class="page" data-rendered="false">
        <!-- Здесь будут блоки скриншотов -->
      </div>

      <!-- Видео -->
      <div id="videos" class="page" data-rendered="false">
        <!-- Здесь будут блоки с видео -->
      </div>

      <!-- История -->
      <div id="history" class="page" data-rendered="false">
        <!-- Здесь будут блоки с историями -->
      </div>

      <!-- Об авторе -->
      <div id="about" class="page" data-rendered="false">
        <!-- Здесь будет информация об авторе -->
      </div>
    </section>
  </main>

  <!-- ======= УНИВЕРСАЛЬНОЕ МОДАЛЬНОЕ ОКНО ======= -->
  <div id="modal" class="modal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-content">

      <!-- Кнопка закрытия -->
      <button class="modal-close" aria-label="Закрыть">&times;</button>

      <!-- Основной медиаконтейнер -->
      <div class="modal-media" id="modal-media"></div>

      <!-- Блок описания и действий -->
      <div class="modal-meta">
        <h3 id="modal-title"></h3>
        <p id="modal-description"></p>

        <!-- Галерея миниатюр -->
        <div class="modal-thumbs" id="modal-thumbs" aria-hidden="true"></div>

        <!-- Кнопки действий -->
        <div class="modal-actions">
          <a id="modal-download" class="btn download-btn" href="#" download>Скачать</a>
          <button class="btn close-btn">Закрыть</button>
        </div>
      </div>

      <!-- Перелистывание (для скриншотов) -->
      <button class="modal-arrow left" id="modal-prev" aria-label="Предыдущий">&lsaquo;</button>
      <button class="modal-arrow right" id="modal-next" aria-label="Следующий">&rsaquo;</button>
    </div>
  </div>

  <!-- ======= СКРИПТЫ ======= -->
  <script src="js/lazysizes.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/shader.js"></script>
  <script src="js/shader2.js"></script>
  <script src="js/shader3.js"></script>
  <script src="js/shader4.js"></script>
  <script src="js/shader5.js"></script>

</body>
</html>
